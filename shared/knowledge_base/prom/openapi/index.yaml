    en:
    ru: |
      Публичное API позволяет компаниям, зарегистрированным на портале получать
      удаленный доступ к управлению данными в Кабинете компании через свой
      собственный программный интерфейс.


      ## Версия API
      Документация публичного API {{DOMAIN}} версии 1.0 (закрытый бета-тест для
      ограниченного количества компаний). Мы будем рады получить от компаний,
      использующих это API, обратную связь с замечаниями по его использованию и
      пожеланиями по улучшению функциональности. Просьба отправлять обратную связь
      на email api@{{DOMAIN}}.


      ## Что может публичное API?
      Воспользовавшись инструментами публичного API вы сможете:
        * Выгружать в свою систему информацию о своих заказах и менять статусы
          заказов в Кабинете компании.
        * Выгружать информацию о сообщениях и менять статусы сообщений в Кабинете
          компании, а также отправлять покупателю ответ на его сообщение через
          Кабинет компании.
        * Получать информацию о клиентах.
        * Получать информацию о своих товарах, а также менять информацию о товарах
          в Кабинете компании.


      ## Как получить доступ к работе с API?
      Для того, чтобы начать работать через публичное API вам необходимо получить
      у сотрудника портала собственный уникальный ключ (токен). Все запросы через
      API выполняются с использованием этого уникального ключа, который является
      идентификатором вашей компании. Храните его в безопасности.
  

      ## Формат отправки запроса к API
      Для отправки или получения информации через публичное API необходимо
      сформировать соответствующий HTTP-заголовок, который должен передаваться при
      каждом запросе к API.\
      Пример такого заголовка:
      ```yaml
      Authorization: Bearer 19efbdc8ee723b7eb9e6dae1f7a20ca4378b288c
      ```
      где `19efbdc8ee723b7eb9e6dae1f7a20ca4378b288c` - ваш уникальный ключ (токен)
      авторизации.

      Пример запроса:
      ```http request
      https://my.{{DOMAIN}}/api/v1/products/list?limit=5
      ```


      ## Тестирование (песочница)
      Рекомендуем вам перед началом работы с API на реальной компании провести
      предварительное тестирование. Для этого
      [зарегистрируйте на портале новую компанию](https://{{DOMAIN}}/reg/7361)
      и сообщите менеджеру вашей компании ее ID, после чего мы вышлем вам
      уникальный ключ для доступа к Кабинету этой компании через API. Вы сможете
      протестировать работу с API на данной компании в течение срока действия
      тестового периода(тестовый период автоматически активируется на {{TRIAL}}
      дней).


      ## Вопросы безопасности
      * Работа через API происходит в режиме безопасного соединения https.
      * Не передавайте никому ваш ключ доступа к API. Чтобы аннулировать ключ,
        необходимо изменить пароль владельца Кабинета компании и запросить у
        сотрудника портала новый ключ. В этом случае случае старый ключ (все
        старые ключи) станет недействительным.
      * Все действия через API автоматически логируются, что обеспечивает
        высокий уровень сохранности вашей информации.

      ## Формат даты и времени
    
      Все поля даты и времени ожидают получить значение времени в часовом поясе UTC.
    
