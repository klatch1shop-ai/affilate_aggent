openapi: 3.0.4
info:
  version: 1.0.0
  title: '{{DOMAIN}} Public API'
  contact:
    name: Public API documentation
  description: |
    The public API allows companies registered on the portal to receive
    remote access to data management in the company's Cabinet through its
    own software interface.
    
    
    ## API version
    Public API documentation {{DOMAIN}} version 1.0 (closed beta test for
    a limited number of companies). We will be glad to receive from companies
    using this API, feedback with notes on its use, and wishes to improve functionality.
    Please send feedback to email api@{{DOMAIN}}.
    
    
    ## What can the public API do?
    Using the public API tools, you can:
    * Upload information about your orders to your system and change statuses
      orders in the company's Cabinet.
    * Upload information about messages and change the status of messages in the
      company's Cabinet, as well as send the buyer a response to his message.
    * Get customer information.
    * Get information about your products, as well as change product information
      in the Cabinet of the company.
    
    
    ## How to get access to the API?
    To start working through the public API, you need to get your own unique
    key (token) from portal employee. All requests through APIs are executed
    using this unique key, which is your company identifier. Keep it safe.
    
    
    ## API request format
    To send or receive information through the public API, you must
    form the appropriate HTTP header, which should be transmitted through
    every API request.\
    An example of such a header:
    ```yaml
    Authorization: Bearer 19efbdc8ee723b7eb9e6dae1f7a20ca4378b288c
    ```
    where `19efbdc8ee723b7eb9e6dae1f7a20ca4378b288c` is your authorization
    unique key (token).
    
    Request example:
    ```http request
    https://my.{{DOMAIN}}/api/v1/products/list?limit=5
    ```
    
    
    ## Testing (sandbox)
    We recommend you before start working with the API on a real company,
    preliminary testing. For this
    [register a new company on the portal](https://{{DOMAIN}}/reg/7361)
    and tell the manager of your company its ID, after which we will send you
    a unique key to access the Cabinet of this company via the API. You can
    test the API on this company during the trial ({{TRIAL}} days of trial
    is automatically activated).
    
    
    ## Security questions
      * Work through the API takes place in the secure https connection mode.
      * Do not share your API access key with anyone. To cancel the key,
        it is necessary to change the password of the owner of the company's Cabinet
        and ask portal employee new authorization unique key (token).
        In this case, the old key (all old keys) will become invalid.
      * All actions through the API are automatically logged, which ensures
        high level of security of your information.
    
    ## Date and time format
    
    All date and time fields expect to receive a time value in the UTC time zone.
    
    # API usage examples:
    [Python2.7](https://github.com/evo-company/company-api-example/blob/master/python/api_python2-7_example.py)\
    [Python3.5](https://github.com/evo-company/company-api-example/blob/master/python/api_python3-5_example.py)\
    [Node.js](https://github.com/evo-company/company-api-example/blob/master/node.js/EvoExampleAPI.js)\
    [PHP](https://github.com/evo-company/company-api-example/blob/master/php/api_php_example.php)\
    [Java](https://github.com/evo-company/company-api-example/blob/master/java/EvoClientExample.java)
    
    
    # Available API methods:
  x-description-i18n:
    uk: |
      Публічне API дозволяє компаніям, зареєстрованим на порталі, отримувати
      віддалений доступ до управління даними в Кабінеті компанії через свій
      власний програмний інтерфейс.
      
      
      ## Версія API
      Документація публічного API {{DOMAIN}} версії 1.0 (закритий бета-тест для
      обмеженої кількості компаній). Ми будемо раді отримати від компаній,
      що використовують це API, зворотний зв'язок із зауваженнями щодо його використання та
      побажаннями щодо покращення функціональності. Прохання надсилати зворотний зв'язок
      на email api@{{DOMAIN}}.
      
      
      ## Що може публічне API?
      Скориставшись інструментами публічного API, ви зможете:
        * Вивантажувати в свою систему інформацію про свої замовлення та змінювати статуси
          замовлень у Кабінеті компанії.
        * Вивантажувати інформацію про повідомлення та змінювати статуси повідомлень у Кабінеті
          компанії, а також надсилати покупцеві відповідь на його повідомлення через
          Кабінет компанії.
        * Отримувати інформацію про клієнтів.
        * Отримувати інформацію про свої товари, а також змінювати інформацію про товари
          у Кабінеті компанії.
      
      
      ## Як отримати доступ до роботи з API?
      Для того, щоб почати працювати через публічне API, вам необхідно отримати
      у співробітника порталу власний унікальний ключ (токен). Всі запити через
      API виконуються за допомогою цього унікального ключа, який є ідентифікатором
      вашої компанії. Зберігайте його у безпеці.
      
      
      ## Формат відправки запиту до API
      Для відправлення або отримання інформації через публічне API необхідно
      сформувати відповідний HTTP-заголовок, який повинен передаватися при
      кожному запиту до API.\
      Приклад такого заголовка:
      ```yaml
      Authorization: Bearer 19efbdc8ee723b7eb9e6dae1f7a20ca4378b288c
      ```
      де `19efbdc8ee723b7eb9e6dae1f7a20ca4378b288c` - ваш унікальний ключ (токен)
      авторизації.
      
      Приклад запиту:
      ```http request
      https://my.{{DOMAIN}}/api/v1/products/list?limit=5
      ```


      ## Тестування (пісочниця)
      Рекомендуємо вам перед початком роботи з API на реальній компанії провести
      попереднє тестування. Для цього
      [зареєструйте на порталі нову компанію](https://{{DOMAIN}}/reg/7361)
      та повідомте менеджеру вашої компанії її ID, після чого ми надішлемо вам
      унікальний ключ для доступу до Кабінету цієї компанії через API. Ви зможете
      протестувати роботу з API на цій компанії протягом терміну дії
      тестового періоду (тестовий період автоматично активується на {{TRIAL}}
      днів).
      
      
      ## Питання безпеки
        * Робота через API відбувається в режимі безпечного з'єднання https.
        * Не передавайте нікому ваш ключ доступу до API. Щоб анулювати ключ,
          необхідно змінити пароль власника Кабінету компанії та запросити у
          співробітника порталу новий ключ. У цьому випадку старий ключ (всі
          старі ключі) стане недійсним.
        * Всі дії через API автоматично логуються, що забезпечує високий
          рівень безпеки вашої інформації.
      
      ## Формат дати й часу
    
      Усі поля дати й часу очікують отримання значення часу в часовому поясі UTC
      
