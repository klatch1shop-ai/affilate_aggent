components:
  schemas:
    Company:
      type: object
      required:
        - id
        - statusCode
        - ownerId
        - updatedBy
        - version
        - createdAt
        - updatedAt
        - feature
        - mainAccount
        - bonusAccount
        - trusted
        - legalEntityId
      properties:
        id:
          type: string
          description: Ідентифікатор компанії
          example: f04030e9-fc19-44cf-80eb-68b7bff4841d
        name:
          type: string
          description: Найменування компанії
          example: Hubber
        statusCode:
          type: string
          enum:
            - new
            - active
            - blocked
            - blocked_by_balance
            - contract_terminated
          description: "Статус компанії "
          example: new
        ownerId:
          type: string
          description: Ідентифікатор власника компанії
          example: f04030e9-fc19-44cf-80eb-68b7bff4841d
        updatedBy:
          type: string
          maxLength: 255
          nullable: true
          description: Оновлено
          example: f04030e9-fc19-44cf-80eb-68b7bff4841d
        version:
          type: integer
          description: Версія ресурсу
          example: 1
        createdAt:
          type: string
          description: Створено в дату й час
          example: 2020-10-10 19:00:00
        updatedAt:
          type: string
          nullable: true
          description: Оновлено о datetime
          example: 2020-10-10 19:00:00
        tariffId:
          type: string
          format: uuid
          description: Ідентифікатор тарифу компанії
          example: 7e4ae1c7-8f0b-4bd2-a7a4-efa8796cea2e
        logo:
          type: string
          nullable: true
          description: Ідентифікатор файлу логотипу
          example: dd6aeb48-0051-40f8-ab47-6a2ee7cb9fe5
        govNumber:
          type: string
          nullable: true
          minimum: 8
          maximum: 10
          description: ЄДРПО або ІПН компанії
          example: "32855961"
        legalEntityId:
          type: integer
          nullable: true
          description: Юридична особа
          example: "1"
        type:
          type: string
          enum:
            - fop
            - tov
            - pp
          nullable: true
          description: Тип компанії
          example: fop
        iban:
          type: string
          nullable: true
          description: Значення IBAN компанії
          example: UA593510050000026201111111111
        responsibleId:
          type: string
          nullable: true
          description: Ідентифікатор відповідального менеджера
          example: "24"
        legalName:
          type: string
          description: Юридична назва компанії/фізичної особи-підприємця
          example: Legal Corp
        contractNumber:
          type: string
          description: Номер контракта
          example: "0000000000000000"
        contractDate:
          type: string
          description: "Дата договору:"
          example: 2018-02-13T21:02:07+00:00
        identityNumber:
          type: string
          description: Номер посвідчення особи (застосовується лише для фізичних
            осіб-підприємців)
          example: 000000000 OR АА0000
        identityIssuedDate:
          type: string
          description: Дата видачі посвідчення особи (застосовується лише для фізичних
            осіб-підприємців)
          example: 2018-02-13T21:02:07+00:00
        identityIssuedBy:
          type: string
          description: Посвідчення особи, видане (застосовується лише для фізичних
            осіб-підприємців)
          example: "1234"
        legalAddressCity:
          type: string
          description: Адреса місцезнаходження
          example: Наддніпрянське
        legalAddressStreet:
          type: string
          description: Юридична адреса вул.
          example: Парковая аллея
        legalAddressHouseNumber:
          type: string
          description: Юридична адреса номер будинку
          example: 9 3/4
        legalAddressOffice:
          type: string
          description: Юридична адреса офіс/квартира номер
          example: "11"
        legalAddressPostalCode:
          type: string
          description: Юридична адреса поштовий індекс
          example: "01000"
        files:
          type: array
          items:
            $ref: "#/components/schemas/CompanyFile"
          description: Файли документів компанії
        address:
          type: string
          maxLength: 255
          nullable: true
          description: Адреса компанії в місті або регіоні
          example: вул. Джобса 1
          deprecated: true
        location:
          type: string
          maxLength: 255
          nullable: true
          description: Місто або регіон компанії
          example: Наддніпрянське
          deprecated: true
        mainAccount:
          $ref: "#/components/schemas/CompanyMainAccount"
          nullable: true
        bonusAccount:
          $ref: "#/components/schemas/CompanyBonusAccount"
          nullable: true
        responsible:
          nullable: true
          type: object
          required:
            - firstName
            - lastName
            - email
            - phone
          properties:
            firstName:
              type: string
              example: Ivan
            lastName:
              type: string
              nullable: true
              example: Ivanovich
            email:
              type: string
              example: test@test.com
            phone:
              type: string
              nullable: true
              example: 1234567890
        shipment_settings:
          $ref: "#/components/schemas/DeliveryShipments"
        criticalLimit:
          type: number
          nullable: true
          description: Критичний доступний рівень балансу
          example: 100
        feature:
          $ref: "#/components/schemas/CompanyFeatureReadModel"
        trusted:
          type: boolean
          example: true
        isActive:
          type: boolean
        contentManagerId:
          type: integer
          nullable: true
          description: "Контент-менеджер "
          example: 100
        isPrepayment:
          type: boolean
        lastChangedAt:
          type: string
          nullable: true
          description: Дата і час останньої зміни статусу
          example: 2020-10-10 19:00:00
        isQuestionsActive:
          type: boolean
    CompanyMainAccount:
      type: object
      required:
        - balance
        - hold
        - total
      properties:
        balance:
          type: number
          format: float
          description: Доступний залишок
          example: 1000
        hold:
          type: number
          format: float
          description: Утримана сума
          example: 10
        total:
          type: number
          format: float
          description: Підсумковий баланс
          example: 1010
    CompanyBonusAccount:
      type: object
      required:
        - balance
