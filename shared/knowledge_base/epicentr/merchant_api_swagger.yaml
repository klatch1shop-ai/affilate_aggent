  responses:
    accepted:
      description: Запит прийнято до обробки
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Successful operation
              code:
                type: integer
                example: 0
    notFound:
      description: Вказаний ресурс не знайдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    unauthorized:
      description: Не авторизовано
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    invalidInput:
      description: Недійсні параметри запиту
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Sorry, something went wrong. We cannot complete this operation at this
                  time. Code: Invalid request parameters."
              code:
                type: integer
                example: 400
              errors:
                type: object
                description: Перелік помилок валідації
    forbidden:
      description: Заборонено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    incompatibleEntity:
      description: Несумісний об 'єкт - помилка перевірки
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                description: Рядок або масив з помилками перевірки
                example: Validation error
              code:
                type: integer
                example: 422
    forbiddenInvalidCredentials:
      description: Заборонено
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: access.denied
              code:
                type: integer
                example: 403
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    wsse:
      type: apiKey
      in: header
      name: X-WSSE
security:
  - jwt: []
  - wsse: []
