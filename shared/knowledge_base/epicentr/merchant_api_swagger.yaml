openapi: 3.0.0
info:
  version: 1.0.0
  title: Merchant API
  description: >
    <p>Публічне API дозволяє зареєстрованим компаніям отримувати віддалений
    доступ до управління даними по замовленням в кабінеті через власний
    програмний інтерфейс.</p>


    <h3>Версія API</h3>

    <p>
      Документація публічного API epicentrm.com.ua версії 1.0.0 (закритий бета-тест для обмеженої кількості компаній).
      Ми будемо раді отримати зворотний зв'язок із зауваженнями щодо його використання та побажаннями щодо покращення функціональності.
      Прохання надсилати зворотний зв'язок на email merchant@epicentrk.ua з відповідною темою листа.
    </p>


    <h3>Що може публічне API?</h3>

    <p>За допомогою API ви можете швидко опрацьовувати замовлення:</p>

    <ul>
      <li>змінювати статус замовлення</li>
      <li>змінювати дані по клієнту</li>
      <li>змінювати дані по доставці та способу оплати</li>
      <li>додавати та видаляти товар</li>
      <li>вносити ТТН для трекінгу та автоматичного завершення замовлення</li>
      <li>отримувати та відправляти коментарі до замовлень</li>
    </ul>


    <h3>Як отримати доступ до API?</h3>

    <p>
      Щоб почати працювати через публічне API, вам необхідно згенерувати власний унікальний ключ (токен).
      Для цього увійдіть до кабінету та перейдіть у вкладку API в Налаштуваннях компанії.
      Всі запити через API виконуються за допомогою цього унікального ключа.
    </p>


    <h3>Формат дати й часу</h3>

    <p>Усі поля дати й часу зазначаються в часовому поясі UTC.</p>


    <h3>Приклади використання API:</h3>

    <ul>
      <li><a target="_blank" href="https://github.com/epicentrm/merchant-api/blob/main/api-samples/python.md">Python</a></li>
      <li><a target="_blank" href="https://github.com/epicentrm/merchant-api/blob/main/api-samples/nodejs.md">Node.js</a></li>
      <li><a target="_blank" href="https://github.com/epicentrm/merchant-api/blob/main/api-samples/php.md">PHP</a></li>
      <li><a target="_blank" href="https://github.com/epicentrm/merchant-api/blob/main/api-samples/java.md">Java</a></li>
    </ul>

    <h3>Доступні методи API:</h3>
paths:
  "/v1/deliveries/shipments/companies/{companyId}/providers":
    get:
      operationId: getDeliveryProviders
      summary: Отримати дані по провайдерам доставки компанії
      description: Отримати дані по провайдерам доставки компанії
      tags:
        - DELIVERY
      parameters:
        - $ref: "#/components/parameters/companyId"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 2
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        enabled:
                          type: boolean
                          nullable: false
                          example: true
                        provider:
                          $ref: "#/components/schemas/DeliveryProvider"
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  "/v3/deliveries/providers/{deliveryProvider}/participants/{participant}/settlements":
    get:
      operationId: getDeliveryProviderParticipantSettlements
      summary: Отримати відділення доставок за провайдером і учасником
      description: Отримати відділення доставок за провайдером і учасником
      tags:
        - DELIVERY
      parameters:
        - $ref: "#/components/parameters/deliveryProvider"
        - $ref: "#/components/parameters/acceptLanguage"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/deliveryParticipant"
        - $ref: "#/components/parameters/title"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySettlementsListModel"
        "401":
          $ref: "#/components/responses/unauthorized"
  "/v3/deliveries/providers/{deliveryProvider}/participants/{participant}/settlements/{settlementId}/offices":
    get:
      operationId: getDeliveryProviderParticipantSettlementsOffices
      summary: Отримати відділення доставок за провайдером і учасником
      description: Отримати відділення доставок за провайдером і учасником
      tags:
        - DELIVERY
      parameters:
        - $ref: "#/components/parameters/deliveryProvider"
        - $ref: "#/components/parameters/acceptLanguage"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/deliveryParticipant"
        - name: settlementId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: aa6682d3-ce98-4bea-80bd-20205dc63195
        - name: filter[isActive]
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 1
            format: int32
            description: Search active or inactive post offices
            example: 1
            default: 1
        - name: filter[title]
          in: query
          required: false
          schema:
            type: string
            minLength: 3
            maxLength: 255
            description: Search by a partial match in a post office title
            example: Hubb
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverySettlementsOfficesListModel"
        "401":
          $ref: "#/components/responses/unauthorized"
  "/v3/deliveries/{provider}/companies/{companyId}/invoice/{number}":
    get:
      operationId: getDeliveryInvoiceV3
      summary: Отримати дані по створеній накладній в новому форматі
      description: Отримати дані по створеній накладній в новому форматі
      tags:
        - DELIVERY
      parameters:
        - $ref: "#/components/parameters/invoiceProvider"
        - $ref: "#/components/parameters/companyIdInPath"
        - $ref: "#/components/parameters/deliveryNumber"
      responses:
        "200":
          description: Операція успішна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceFileReadModel"
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  "/v2/deliveries/pickup/companies/{companyId}/pickup-points/enabled":
    get:
      operationId: getSpecificCompanyPickupPointsListEnabled
      summary: Отримати список пунктів самовивозу
      description: Отримати список пунктів самовивозу
      tags:
        - DELIVERY
      parameters:
        - $ref: "#/components/parameters/companyId"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Операція успішна
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CollectionResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        description: List of items
                        items:
                          $ref: "#/components/schemas/PickupPointRead"
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  "/v2/oms/orders/{orderId}/comments":
    post:
      operationId: addCommentToOrder
      summary: Додати коментар до замовлення
      description: Додати коментар до замовлення
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  example: lorem ipsum
      responses:
        "204":
          description: Операція успішна
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
    get:
      operationId: getCommentsFromOrder
      summary: Отримати список коментарів по замовленню
      description: Отримати список коментарів по замовленню
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsOrderId"
        - $ref: "#/components/parameters/offset"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Операція успішна
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CollectionResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        description: List of comments
                        items:
                          type: object
                          required:
                            - content
                            - firstName
                            - lastName
                            - avatar
                            - userId
                            - createdAt
                          properties:
                            content:
                              type: string
                              example: lorem ipsum
                            firstName:
                              type: string
                              example: John
                            lastName:
                              type: string
                              example: Doe
                            avatar:
                              type: string
                              example: http://example.com/avatar.jpg
                            userId:
                              type: string
                              example: "42"
                            createdAt:
                              type: string
                              example: 2020-05-20T05:35:12+00:00
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  "/v2/oms/orders/{orderId}/allowed-statuses":
    get:
      operationId: getOrderAllowedStatuses
      summary: Отримати список доступних статусів для переведення замовлення
      description: Отримати список доступних статусів для переведення замовлення
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsOrderId"
      responses:
        "200":
          description: Операція успішна
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderAllowedStatus"
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  "/v2/oms/orders/{orderId}/change-status/to/{orderStatus}":
    post:
      operationId: changeOrderStatus
      summary: Змінити статус замовлення
      description: Змінити статус замовлення
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsOrderId"
        - name: orderStatus
          in: path
          required: true
          description: Статус замовлення
          schema:
            $ref: "#/components/schemas/OrderStatus"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderChangeStatusWriteModel"
            examples:
              CancelWriteModel:
                value:
                  reason_code: Some reason
                  translationKey: order.cancel_reason.product_not_available
                  comment: Some comment
              SentWriteModel:
                value:
                  provider: nova_poshta
                  number: "100321569875"
      responses:
        "202":
          description: Операція успішна
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  "/v2/oms/orders/{orderId}/items/{offerId}":
    delete:
      operationId: deleteOrderItem
      summary: Видалити товар з замовлення
      description: Видалити товар з замовлення
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsOrderId"
        - $ref: "#/components/parameters/omsOfferId"
      responses:
        "204":
          description: Операція успішна
        "400":
          $ref: "#/components/responses/invalidInput"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
  /v2/oms/order-cancel-reasons/customer:
    get:
      operationId: getInternalOrdersCancelReasonsByRole
      summary: Отримати список причин скасування замовлення
      description: Отримати список причин скасування замовлення
      tags:
        - OMS
      responses:
        "200":
          description: Операція успішна
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 1
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderCancelReason"
  "/v2/oms/orders/{orderId}/payment/generate-url":
    post:
      operationId: generatePaymentUrl
      summary: Згенерувати посилання на оплату карткою онлайн
      description: Згенерувати посилання на оплату карткою онлайн
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsOrderId"
      responses:
        "204":
          description: Операція успішна
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
  "/v2/oms/orders/{orderId}/call-status":
    post:
      operationId: editOrderCallStatus
      summary: Оновити статус дзвінка
      description: Оновити статус дзвінка
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsOrderId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCallStatusInput"
      responses:
        "202":
          description: Операція успішна
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  /v3/oms/orders:
    get:
      operationId: getOrdersV3
      summary: Отримати список замовлень по заданим параметрам фільтрації
      description: Отримати список замовлень по заданим параметрам фільтрації
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsFilterV3"
        - $ref: "#/components/parameters/omsSort"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Операція успішна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListModel"
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  /v3/oms/orders/total:
    get:
      operationId: getOrdersTotalV3
      summary: Отримати кількість замовлень по заданим параметрам фільтрації
      description: Отримати кількість замовлень по заданим параметрам фільтрації
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsFilterV3"
        - $ref: "#/components/parameters/omsSort"
        - $ref: "#/components/parameters/cursor"
      responses:
        "200":
          description: Операція успішна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListTotalModel"
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  "/v3/oms/orders/{orderId}/client-data":
    post:
      operationId: editOrderClientDataV3
      summary: Update order client data
      description: |
        Update order client data:
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/orderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
                - recipient
              properties:
                firstName:
                  type: string
                  example: Петро
                  x-faker: internet.userName
                lastName:
                  type: string
                  example: Петрушенко
                  x-faker: internet.userName
                patronymic:
                  type: string
                  example: Петрович
                  x-faker: internet.userName
                email:
                  type: string
                  example: test@test.com
                phone:
                  type: string
                  example: "380661112233"
                  x-faker: phone.phoneNumber
                recipient:
                  $ref: "#/components/schemas/OrderAddressV3/properties/recipient"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderAddressV3"
        "400":
          $ref: "#/components/responses/invalidInput"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
        "410":
          description: item was deleted
  "/v3/oms/orders/{orderId}/items/{offerId}":
    put:
      operationId: editOrderItemV3
      summary: Змінити кількість товару в замовленні
      description: Змінити кількість товару в замовленні
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsOrderId"
        - $ref: "#/components/parameters/omsOfferId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderItemInput"
      responses:
        "200":
          description: Операція успішна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItemV3"
        "400":
          $ref: "#/components/responses/invalidInput"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
  "/v3/oms/orders/{orderId}/items":
    post:
      operationId: addOrderItemV3
      summary: Додати товар в замовлення
      description: Додати товар в замовлення
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/omsOrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - productId
                - siteUrl
              properties:
                productId:
                  type: string
                  example: "2365141"
                siteUrl:
                  type: string
                  example: https://test.domain/product
      responses:
        "200":
          description: Операція успішна
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderItemV3"
        "400":
          $ref: "#/components/responses/invalidInput"
        "401":
          $ref: "#/components/responses/unauthorized"
        "403":
          $ref: "#/components/responses/forbidden"
        "404":
          $ref: "#/components/responses/notFound"
  "/v3/oms/orders/{orderId}/shipping/{deliveryProvider}":
    post:
      operationId: createOrderShipmentV3
      summary: Create order shipment
      description: Додати накладну
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/deliveryProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateShipmentModelV3"
      responses:
        "201":
          description: Successful operation
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  "/v3/oms/orders/{orderId}/delivery-data/{deliveryProvider}":
    post:
      operationId: editOrderDeliveryDataV3
      summary: Змінити дані по доставці та способу оплати
      description: Змінити дані по доставці та способу оплати
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/deliveryProvider"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required:
                - settlementId
                - officeId
              properties:
                settlementId:
                  type: string
                  format: uuid
                  description: ID міста постачальника доставки
                  example: 42404049-cc5a-4da9-ad4c-9b9096c2bed2
                officeId:
                  type: string
                  format: uuid
                  description: ID поштового відділення постачальника доставки
                  example: 42404049-cc5a-4da9-ad4c-9b9096c2bed2
                paymentProvider:
                  type: string
                  enum:
                    - pay_on_pickup
                    - pay_on_delivery
                    - easypay
                    - monobank
                    - invoice
      responses:
        "202":
          description: Операція успішна
        "401":
          $ref: "#/components/responses/unauthorized"
        "404":
          $ref: "#/components/responses/notFound"
  "/v5/oms/orders/{orderId}":
    get:
      operationId: getOrderDetailsV5
      summary: Отримати дані по замовленню V5
      description: |
        Get order details V5:
      tags:
        - OMS
      parameters:
        - $ref: "#/components/parameters/orderId"
        - $ref: "#/components/parameters/omsEnables"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - companyId
                  - customerId
                  - commentsCount
                  - number
                  - createdAt
                  - statusCode
                  - subtotal
                  - payed
                  - skipCustomerContact
                  - items
                  - address
                  - cancel
                  - company
                  - settlement
                  - office
                  - legalEntityId
                  - hasFeedback
                  - callStatus
                  - contractor
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Order id
                    example: dec9761c-9ed0-403f-a01a-5e25154ebcab
                    x-faker: datatype.uuid
                  externalId:
                    type: string
                    nullable: true
                    description: Order id from external system
                    example: "888888"
                    x-faker:
                      helpers.arrayElement:
                        - "12345"
                  companyId:
                    type: string
                    format: uuid
                    example: 1e0ca935-a61d-41bc-9bd3-8c2833b72f6d
                  legalEntityId:
                    type: number
                    example: 2
                    x-faker: datatype.number
                  trustedCompany:
                    type: boolean
                    example: true
                  customerId:
                    type: string
                    nullable: true
                    format: uuid
